name: "EuSou - Backup & Disaster Recovery Pipeline"

on:
  schedule:
    # Execução diária automatizada às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da execução manual do backup'
        required: false
        default: 'Backup manual sob demanda'

concurrency:
  group: backup-pipeline
  cancel-in-progress: false

jobs:
  backup-and-offsite-upload:
    name: "Executar Backup Lógico e Upload Off-Site"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout do Repositório"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: "Instalar Dependências do Backend"
        run: |
          cd backend
          npm ci

      - name: "Diagnóstico e Verificação de Segredos"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        run: |
          node -e '
            const hasDb = Boolean(process.env.DATABASE_URL || process.env.DIRECT_URL);
            const hasS3 = Boolean(process.env.S3_BUCKET && process.env.S3_ACCESS_KEY_ID);
            console.log("=================================================");
            console.log("   DIAGNÓSTICO DE CONFIGURAÇÃO DO BACKUP EUSOU   ");
            console.log("=================================================");
            console.log("DATABASE_URL / DIRECT_URL:", hasDb ? "✓ CONFIGURADO" : "✗ AUSENTE");
            console.log("S3 STORAGE OFF-SITE:      ", hasS3 ? "✓ CONFIGURADO" : "⚠ NÃO CONFIGURADO (Backup será preservado nos Artefatos)");
            console.log("=================================================");
            if (!hasDb) {
              console.error("ERRO CRÍTICO: As credenciais do banco (DATABASE_URL ou DIRECT_URL) não foram encontradas nos Secrets do repositório GitHub.");
              console.error("Acesse o repositório no GitHub: Settings > Secrets and variables > Actions e adicione DATABASE_URL ou DIRECT_URL.");
              process.exit(1);
            }
          '

      - name: "Executar Pipeline de Backup e Upload Off-Site"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_STORAGE_TYPE: 's3'
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          ALLOW_SKIP_OFFSITE_IF_UNCONFIGURED: 'true'
        run: |
          node scripts/backup/run-backup-pipeline.js

      - name: "Preservar Backup nos Artefatos Seguros do GitHub"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eusou-database-backup
          path: |
            backups/*.sql
            backups/*.manifest.json
          retention-days: 14
          if-no-files-found: ignore

      - name: "Verificar Integridade Pós-Pipeline"
        run: |
          echo "Pipeline de backup concluído com integridade e registros estruturados."
